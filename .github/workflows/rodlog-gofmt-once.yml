name: 🧹 rodlog · One-time gofmt

on:
  push:
    paths:
      - ".github/workflows/rodlog-gofmt-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/rodlog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rodlog
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/rodlog/go.mod
          cache: false
      - name: Format and commit Go sources
        run: |
          set -euo pipefail
          cd packages/rodlog
          gofmt -w .
          cd ../..
          if git diff --quiet -- 'packages/rodlog/**/*.go' 'packages/rodlog/*.go'; then
            echo "Go files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'packages/rodlog'
          git commit -m "style(rodlog): format all Go sources with gofmt"
          git push origin HEAD:feat/rodlog
