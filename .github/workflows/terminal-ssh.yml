name: "🔐 Terminal · SSH via Tailscale"
run-name: "SSH · ${{ github.ref_name }} · ${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Session duration in minutes (5–300)"
        type: number
        required: true
        default: 120
permissions:
  contents: read
concurrency:
  group: rod-terminal-persistent
  cancel-in-progress: false
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      TAILSCALE_HOSTNAME: rod-terminal
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$TAILSCALE_AUTHKEY" ]] || { echo "::error::Set Actions secret TAILSCALE_AUTHKEY"; exit 1; }
          [[ -n "$SSH_PUBLIC_KEY" ]] || { echo "::error::Set repository variable SSH_PUBLIC_KEY"; exit 1; }
          [[ "$SSH_PUBLIC_KEY" =~ ^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+[A-Za-z0-9+/=]+([[:space:]].*)?$ ]] || { echo "::error::SSH_PUBLIC_KEY must be a single OpenSSH public key"; exit 1; }
          [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] && (( SESSION_MINUTES >= 5 && SESSION_MINUTES <= 300 )) || { echo "::error::minutes must be 5..300"; exit 1; }
      - name: Generate Rod Kisten Bot installation token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: rodkisten
          repositories: ssh
          permission-contents: write
      - name: Restore persistent workspace
        uses: actions/cache/restore@v4
        with:
          path: .rod-workspace
          key: terminal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terminal-state-
      - name: Restore personal shell settings
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .rod-workspace/dotfiles
          chmod 700 .rod-workspace .rod-workspace/dotfiles
          if [[ -f .rod-workspace/dotfiles/zshrc.local ]]; then
            install -m 600 .rod-workspace/dotfiles/zshrc.local "$HOME/.zshrc.local"
            echo "[RESTORE] ~/.zshrc.local from previous workspace snapshot"
          else
            touch "$HOME/.zshrc.local"
            chmod 600 "$HOME/.zshrc.local"
            echo "[NEW] ~/.zshrc.local initialized"
          fi
      - name: Prepare workspace and SSH daemon
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq tailscale
          mkdir -p .rod-workspace "$HOME/.ssh"
          chmod 700 "$HOME/.ssh" .rod-workspace
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo chown -R runner:runner "$HOME/.ssh"
          echo "Authorized client key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/authorized_keys" -E sha256
          getent passwd runner | cut -d: -f1,6,7
          stat -c '%U:%G %a %n' "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
          # Ubuntu hosted runners may ship the runner account with a locked
          # shadow password. OpenSSH rejects the account before checking keys.
          # Give it a random unknown password hash to unlock the account;
          # SSH password and keyboard-interactive authentication remain disabled.
          random_password="$(openssl rand -hex 48)"
          password_hash="$(openssl passwd -6 "$random_password")"
          unset random_password
          printf 'runner:%s\n' "$password_hash" | sudo chpasswd -e
          unset password_hash
          if sudo passwd -S runner | awk '{print $2}' | grep -qx L; then
            echo "::error::runner account is still locked"
            exit 1
          fi
          echo "runner account unlocked; SSH remains key-only"
          sudo mkdir -p /run/sshd
          sudo tee /tmp/rod-sshd.conf >/dev/null <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers runner
          AuthorizedKeysFile /home/runner/.ssh/authorized_keys
          StrictModes yes
          LogLevel VERBOSE
          PidFile /tmp/rod-sshd.pid
          Subsystem sftp internal-sftp
          EOF
          sudo sshd -t -f /tmp/rod-sshd.conf
          sudo /usr/sbin/sshd -E /tmp/rod-sshd.log -f /tmp/rod-sshd.conf
          sudo sshd -T -f /tmp/rod-sshd.conf -C user=runner,host=localhost,addr=127.0.0.1 | grep -E '^(authorizedkeysfile|pubkeyauthentication|passwordauthentication|strictmodes|allowusers) ' || true
          echo "SSH daemon listening on loopback only, port 2222"
      - name: Connect to tailnet and publish private SSH port
        shell: bash
        run: |
          set -Eeuo pipefail
          # Set a predictable node name; Tailscale may append a suffix if an
          # older node with this name is still registered in the tailnet.
          export TS_SOCKET="$HOME/.local/state/rod-codespaces/tailscale/tailscaled.sock"
          bash scripts/tailscale.sh start
          state_dir="$HOME/.local/state/rod-codespaces/tailscale"
          key_file="$(mktemp "$state_dir/authkey.XXXXXXXX")"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$TAILSCALE_AUTHKEY" > "$key_file"
          timeout 60 tailscale --socket="$TS_SOCKET" up --auth-key="file:$key_file" --hostname="$TAILSCALE_HOSTNAME" --accept-dns=false
          rm -f "$key_file"
          # Userspace Tailscale has no kernel interface; Tailscale Serve forwards
          # inbound tailnet TCP traffic to the loopback-only SSH daemon.
          tailscale --socket="$HOME/.local/state/rod-codespaces/tailscale/tailscaled.sock" serve --bg --tcp=22 tcp://127.0.0.1:2222
          echo "### SSH session ready" >> "$GITHUB_STEP_SUMMARY"
          echo 'Connect from a device on the same tailnet:' >> "$GITHUB_STEP_SUMMARY"
          echo 'ssh runner@<tailscale-ip>' >> "$GITHUB_STEP_SUMMARY"
          echo 'sftp runner@<tailscale-ip>' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tailnet IP:' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/tailscale.sh ip | tee -a "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual Tailscale device name (check for numeric suffixes):' >> "$GITHUB_STEP_SUMMARY"
          tailscale --socket="$TS_SOCKET" status --json | jq -r '.Self.DNSName // .Self.HostName // "unknown"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::SSH is available only while this workflow runs. Check the job summary for its tailnet IP."
      - name: Initialize Rod shell environment
        shell: bash
        run: |
          set -Eeuo pipefail
          # Log each planned operation; skip already-satisfied prerequisites.
          # Never echo secrets or run with shell xtrace enabled.
          step=0
          run_step() {
            local label="$1"
            shift
            step=$((step + 1))
            printf '\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n'
            printf '[%02d] RUN  %s\n' "$step" "$label"
            printf '     Command:'
            printf ' %q' "$@"
            printf '\n'
            if "$@"; then
              printf '[%02d] OK   %s\n' "$step" "$label"
            else
              local rc=$?
              printf '::error::[%02d] FAIL %s (exit %d)\n' "$step" "$label" "$rc"
              return "$rc"
            fi
          }
          skip_step() {
            step=$((step + 1))
            printf '\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n'
            printf '[%02d] SKIP %s: %s\n' "$step" "$1" "$2"
          }
          install_missing_packages() {
            local missing=() name
            for name in zsh git fzf micro zoxide; do
              if command -v "$name" >/dev/null 2>&1; then
                skip_step "Install $name" "command already available at $(command -v "$name")"
              else
                missing+=("$name")
              fi
            done
            if (( ${#missing[@]} )); then
              run_step "Refresh apt package index" sudo apt-get update -qq
              run_step "Install missing shell packages" sudo apt-get install -y -qq "${missing[@]}"
            else
              skip_step "APT installation" "all commands already exist"
            fi
          }
          install_omz() {
            local dest="$HOME/.oh-my-zsh"
            if [[ -f "$dest/oh-my-zsh.sh" ]]; then
              skip_step "Oh My Zsh" "$dest/oh-my-zsh.sh exists"
              return
            fi
            if [[ -d "$dest" ]] && [[ -n "$(ls -A "$dest")" ]]; then
              # Preserve existing user files. Clone to an empty temporary dir
              # and copy only missing files into the pre-existing directory.
              local temp
              temp="$(mktemp -d)"
              run_step "Clone Oh My Zsh to temporary directory" git clone -q --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$temp/oh-my-zsh"
              run_step "Merge missing Oh My Zsh files" cp -an "$temp/oh-my-zsh/." "$dest/"
              rm -rf "$temp"
            else
              [[ -d "$dest" ]] && rmdir "$dest"
              run_step "Clone Oh My Zsh" git clone -q --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$dest"
            fi
            [[ -f "$dest/oh-my-zsh.sh" ]] || { echo "::error::Oh My Zsh entrypoint missing"; return 1; }
          }
          install_plugin() {
            local name="$1" source="$2" dest="$HOME/.oh-my-zsh/custom/plugins/$1"
            if [[ -d "$dest" ]]; then
              skip_step "Plugin $name" "$dest already exists"
            else
              run_step "Install plugin $name" git clone -q --depth=1 "https://github.com/$source.git" "$dest"
            fi
          }
          install_missing_packages
          export CODESPACE_VSCODE_FOLDER="$GITHUB_WORKSPACE"
          if [[ -f scripts/bootstrap.sh ]]; then
            run_step "Run existing bootstrap" bash scripts/bootstrap.sh start
          else
            skip_step "Bootstrap" "scripts/bootstrap.sh missing"
          fi
          if command -v git >/dev/null 2>&1; then
            install_omz
            mkdir -p "$HOME/.oh-my-zsh/custom/plugins" "$HOME/.oh-my-zsh/custom/themes"
            install_plugin zsh-autosuggestions zsh-users/zsh-autosuggestions
            install_plugin zsh-completions zsh-users/zsh-completions
            install_plugin zsh-syntax-highlighting zsh-users/zsh-syntax-highlighting
          else
            skip_step "Oh My Zsh and plugins" "git unavailable"
          fi
          if [[ -f zsh/rod-mobile.zsh-theme && -d "$HOME/.oh-my-zsh/custom/themes" ]]; then
            run_step "Install Rod theme" cp zsh/rod-mobile.zsh-theme "$HOME/.oh-my-zsh/custom/themes/rod-mobile.zsh-theme"
          else
            skip_step "Rod theme" "source or destination directory missing"
          fi
          if command -v zsh >/dev/null 2>&1; then
            if [[ "$(getent passwd runner | cut -d: -f7)" == "$(command -v zsh)" ]]; then
              skip_step "Default shell" "runner already uses zsh"
            else
              run_step "Set default shell" sudo chsh -s "$(command -v zsh)" runner
            fi
            [[ -d "$HOME/.oh-my-zsh/custom" ]] && run_step "Secure Zsh plugin permissions" chmod -R go-w "$HOME/.oh-my-zsh/custom"
            if [[ -f "$HOME/.zshrc" ]]; then
              run_step "Validate Zsh configuration" zsh -n "$HOME/.zshrc"
            else
              skip_step "Zsh validation" "~/.zshrc missing"
            fi
          else
            skip_step "Zsh configuration" "zsh command unavailable"
          fi
          printf '\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n'
          echo "Rod shell setup completed"
      - name: Initialize remote personal shell sync
        env:
          SSH_SYNC_TOKEN: ${{ steps.bot.outputs.token }}
        shell: bash
        run: |
          if [[ -n "${SSH_SYNC_TOKEN:-}" ]]; then
            bash scripts/rod-sync.sh init
          else
            echo "::warning::SSH_SYNC_TOKEN not configured; remote synchronization is disabled"
          fi
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec bash "%s/scripts/rod-sync.sh" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/.local/bin/rod-sync"
          chmod 700 "$HOME/.local/bin/rod-sync"
      - name: Keep SSH available
        env:
          SSH_SYNC_TOKEN: ${{ steps.bot.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          snapshot() {
            if [[ -f "$HOME/.zshrc.local" ]]; then
              install -m 600 "$HOME/.zshrc.local" "$GITHUB_WORKSPACE/.rod-workspace/dotfiles/zshrc.local"
              echo "[SYNC] $(date -u +%FT%TZ) ~/.zshrc.local -> workspace snapshot"
            else
              echo "[SKIP] ~/.zshrc.local missing"
            fi
          }
          finalize() {
            snapshot || true
            if [[ -n "${SSH_SYNC_TOKEN:-}" ]]; then
              bash scripts/rod-sync.sh now || true
            fi
          }
          trap finalize EXIT
          trap 'finalize; exit 130' INT
          trap 'finalize; exit 143' TERM
          echo "Session open for $SESSION_MINUTES minutes. Cancel the job to disconnect early."
          echo "Snapshot every 60 seconds; final GitHub cache/artifact upload is best-effort."
          end=$((SECONDS + SESSION_MINUTES * 60))
          while (( SECONDS < end )); do
            sleep 15
            if (( SECONDS % 60 < 15 )); then
              snapshot
              if [[ -n "${SSH_SYNC_TOKEN:-}" ]]; then
                bash scripts/rod-sync.sh now || echo "::warning::Remote sync failed; local snapshot retained"
              fi
            fi
            if [[ -f /tmp/rod-sshd.log ]]; then
              sudo tail -n 30 /tmp/rod-sshd.log | grep -E 'Failed publickey|Accepted publickey|Authentication refused|bad ownership|Could not open|not allowed|Connection closed|Invalid user' | tail -n 10 || true
            fi
          done
      - name: Final personal shell snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p .rod-workspace/dotfiles
          if [[ -f "$HOME/.zshrc.local" ]]; then
            install -m 600 "$HOME/.zshrc.local" .rod-workspace/dotfiles/zshrc.local
            echo "[OK] Final ~/.zshrc.local snapshot"
          else
            echo "[SKIP] No personal Zsh configuration"
          fi
      - name: Final remote personal shell sync
        if: always()
        env:
          SSH_SYNC_TOKEN: ${{ steps.bot.outputs.token }}
        shell: bash
        run: |
          if [[ -n "${SSH_SYNC_TOKEN:-}" && -f scripts/rod-sync.sh ]]; then
            bash scripts/rod-sync.sh now || echo "::warning::Final remote sync failed"
          else
            echo "[SKIP] Remote sync unavailable"
          fi
      - name: Save persistent workspace
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rod-workspace
          key: terminal-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload workspace snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-workspace-${{ github.run_id }}
          path: .rod-workspace/
          if-no-files-found: ignore
          retention-days: 3
