name: "🔐 Terminal · SSH via Tailscale"
run-name: "SSH · ${{ github.ref_name }} · ${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Session duration in minutes (5–300)"
        type: number
        required: true
        default: 120
permissions:
  contents: read
concurrency:
  group: rod-terminal-persistent
  cancel-in-progress: false
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      TAILSCALE_HOSTNAME: rod-terminal
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$TAILSCALE_AUTHKEY" ]] || { echo "::error::Set Actions secret TAILSCALE_AUTHKEY"; exit 1; }
          [[ -n "$SSH_PUBLIC_KEY" ]] || { echo "::error::Set repository variable SSH_PUBLIC_KEY"; exit 1; }
          [[ "$SSH_PUBLIC_KEY" =~ ^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+[A-Za-z0-9+/=]+([[:space:]].*)?$ ]] || { echo "::error::SSH_PUBLIC_KEY must be a single OpenSSH public key"; exit 1; }
          [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] && (( SESSION_MINUTES >= 5 && SESSION_MINUTES <= 300 )) || { echo "::error::minutes must be 5..300"; exit 1; }
      - name: Restore persistent workspace
        uses: actions/cache/restore@v4
        with:
          path: .rod-workspace
          key: terminal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terminal-state-
      - name: Prepare workspace and SSH daemon
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq tailscale
          mkdir -p .rod-workspace "$HOME/.ssh"
          chmod 700 "$HOME/.ssh" .rod-workspace
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo chown -R runner:runner "$HOME/.ssh"
          echo "Authorized client key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/authorized_keys" -E sha256
          getent passwd runner | cut -d: -f1,6,7
          stat -c '%U:%G %a %n' "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
          # Ubuntu hosted runners may ship the runner account with a locked
          # shadow password. OpenSSH rejects the account before checking keys.
          # Give it a random unknown password hash to unlock the account;
          # SSH password and keyboard-interactive authentication remain disabled.
          random_password="$(openssl rand -hex 48)"
          password_hash="$(openssl passwd -6 "$random_password")"
          unset random_password
          printf 'runner:%s\n' "$password_hash" | sudo chpasswd -e
          unset password_hash
          if sudo passwd -S runner | awk '{print $2}' | grep -qx L; then
            echo "::error::runner account is still locked"
            exit 1
          fi
          echo "runner account unlocked; SSH remains key-only"
          sudo mkdir -p /run/sshd
          sudo tee /tmp/rod-sshd.conf >/dev/null <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers runner
          AuthorizedKeysFile /home/runner/.ssh/authorized_keys
          StrictModes yes
          LogLevel VERBOSE
          PidFile /tmp/rod-sshd.pid
          Subsystem sftp internal-sftp
          EOF
          sudo sshd -t -f /tmp/rod-sshd.conf
          sudo /usr/sbin/sshd -E /tmp/rod-sshd.log -f /tmp/rod-sshd.conf
          sudo sshd -T -f /tmp/rod-sshd.conf -C user=runner,host=localhost,addr=127.0.0.1 | grep -E '^(authorizedkeysfile|pubkeyauthentication|passwordauthentication|strictmodes|allowusers) ' || true
          echo "SSH daemon listening on loopback only, port 2222"
      - name: Connect to tailnet and publish private SSH port
        shell: bash
        run: |
          set -Eeuo pipefail
          # Set a predictable node name; Tailscale may append a suffix if an
          # older node with this name is still registered in the tailnet.
          export TS_SOCKET="$HOME/.local/state/rod-codespaces/tailscale/tailscaled.sock"
          bash scripts/tailscale.sh start
          state_dir="$HOME/.local/state/rod-codespaces/tailscale"
          key_file="$(mktemp "$state_dir/authkey.XXXXXXXX")"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$TAILSCALE_AUTHKEY" > "$key_file"
          timeout 60 tailscale --socket="$TS_SOCKET" up --auth-key="file:$key_file" --hostname="$TAILSCALE_HOSTNAME" --accept-dns=false
          rm -f "$key_file"
          # Userspace Tailscale has no kernel interface; Tailscale Serve forwards
          # inbound tailnet TCP traffic to the loopback-only SSH daemon.
          tailscale --socket="$HOME/.local/state/rod-codespaces/tailscale/tailscaled.sock" serve --bg --tcp=22 tcp://127.0.0.1:2222
          echo "### SSH session ready" >> "$GITHUB_STEP_SUMMARY"
          echo 'Connect from a device on the same tailnet:' >> "$GITHUB_STEP_SUMMARY"
          echo 'ssh runner@<tailscale-ip>' >> "$GITHUB_STEP_SUMMARY"
          echo 'sftp runner@<tailscale-ip>' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tailnet IP:' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/tailscale.sh ip | tee -a "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual Tailscale device name (check for numeric suffixes):' >> "$GITHUB_STEP_SUMMARY"
          tailscale --socket="$TS_SOCKET" status --json | jq -r '.Self.DNSName // .Self.HostName // "unknown"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::SSH is available only while this workflow runs. Check the job summary for its tailnet IP."
      - name: Initialize Rod shell environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh git fzf micro zoxide
          export CODESPACE_VSCODE_FOLDER="$GITHUB_WORKSPACE"
          # Existing bootstrap was only wired to devcontainer lifecycle hooks.
          # Run it explicitly on this standalone SSH runner.
          bash scripts/bootstrap.sh start
          mkdir -p "$HOME/.oh-my-zsh/custom/plugins" "$HOME/.oh-my-zsh/custom/themes"
          if [[ ! -f "$HOME/.oh-my-zsh/oh-my-zsh.sh" ]]; then
            git clone -q --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
          fi
          for entry in 'zsh-autosuggestions:zsh-users/zsh-autosuggestions' 'zsh-completions:zsh-users/zsh-completions' 'zsh-syntax-highlighting:zsh-users/zsh-syntax-highlighting'; do
            plugin="${entry%%:*}"
            source="${entry#*:}"
            if [[ ! -d "$HOME/.oh-my-zsh/custom/plugins/$plugin" ]]; then
              git clone -q --depth=1 "https://github.com/$source.git" "$HOME/.oh-my-zsh/custom/plugins/$plugin"
            fi
          done
          cp zsh/rod-mobile.zsh-theme "$HOME/.oh-my-zsh/custom/themes/rod-mobile.zsh-theme"
          sudo chsh -s /usr/bin/zsh runner
          # zsh compinit refuses group-writable plugin directories; inspect and
          # correct only the directories installed for this ephemeral runner.
          chmod -R go-w "$HOME/.oh-my-zsh/custom"
          zsh -n "$HOME/.zshrc"
          echo "Rod shell initialized for future SSH sessions"
      - name: Keep SSH available
        shell: bash
        run: |
          echo "Session open for $SESSION_MINUTES minutes. Cancel the job to disconnect early."
          end=$((SECONDS + SESSION_MINUTES * 60))
          while (( SECONDS < end )); do
            sleep 15
            if [[ -f /tmp/rod-sshd.log ]]; then
              sudo tail -n 30 /tmp/rod-sshd.log | grep -E 'Failed publickey|Accepted publickey|Authentication refused|bad ownership|Could not open|not allowed|Connection closed|Invalid user' | tail -n 10 || true
            fi
          done
      - name: Save persistent workspace
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rod-workspace
          key: terminal-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload workspace snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-workspace-${{ github.run_id }}
          path: .rod-workspace/
          if-no-files-found: ignore
          retention-days: 3
