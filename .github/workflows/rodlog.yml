name: 🌈 rodlog · Test & Release

on:
  push:
    paths:
      - "packages/rodlog/**"
      - ".github/workflows/rodlog.yml"
  pull_request:
    paths:
      - "packages/rodlog/**"
      - ".github/workflows/rodlog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rodlog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/rodlog/go.mod
          cache: false
      - name: 🧹 Verify committed Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi
      - name: 📦 Verify Go dependencies
        run: |
          go mod tidy
          go mod verify
      - name: 🧪 Go tests
        run: go test -race -v ./...
      - name: 🎬 Structured output examples
        run: go test -v -run 'TestJSONTable|TestJSONCommandAllowlist|TestSyntaxLanguage' ./...
      - name: 🎬 Output examples
        run: go test -v -run TestOutputExamples ./...
      - name: 🔨 Build
        run: go build ./cmd/rodlog

  artifacts:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: 📦 Publish main build artifacts
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/rodlog/go.mod
          cache: false
      - name: 📦 Resolve Go modules
        run: cd packages/rodlog && go mod tidy
      - name: 📦 Cross-compile
        run: |
          mkdir -p dist
          cd packages/rodlog
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "../../dist/rodlog_${os}_${arch}" ./cmd/rodlog
            done
          done
          cd ../../dist
          sha256sum rodlog_* > checksums.txt
      - name: 📎 Upload installable binaries
        uses: actions/upload-artifact@v4
        with:
          name: rodlog-main-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: 🔐 Generate site publishing token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RODLOG_APP_ID }}
          private-key: ${{ secrets.RODLOG_APP_PRIVATE_KEY }}
          owner: rodkisten
          repositories: rodkisten.github.io
          permission-contents: write
      - name: 🌐 Publish binaries to rodkisten.github.io
        env:
          PAGES_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            "https://x-access-token:${PAGES_TOKEN}@github.com/rodkisten/rodkisten.github.io.git" site
          mkdir -p site/rodlog/releases
          cp dist/rodlog_* dist/checksums.txt site/rodlog/releases/
          cat > site/rodlog/releases/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>rodlog releases</title>
          <h1>🌈 rodlog · Downloads</h1>
          <p>Latest successful main build. SHA-256 checksums are available below.</p>
          <ul>
            <li><a href="rodlog_linux_amd64">Linux AMD64</a></li>
            <li><a href="rodlog_linux_arm64">Linux ARM64</a></li>
            <li><a href="rodlog_darwin_amd64">macOS AMD64</a></li>
            <li><a href="rodlog_darwin_arm64">macOS ARM64</a></li>
            <li><a href="checksums.txt">SHA-256 checksums</a></li>
          </ul>
          </html>
          HTML
          cd site
          if [ -z "$APP_SLUG" ]; then
            echo "::error::GitHub App slug was not returned by create-github-app-token"
            exit 1
          fi
          BOT_LOGIN="${APP_SLUG}[bot]"
          BOT_ID="$(GH_TOKEN="$PAGES_TOKEN" gh api "/users/$BOT_LOGIN" --jq .id)"
          if [ -z "$BOT_ID" ]; then
            echo "::error::Could not resolve GitHub App bot ID for $BOT_LOGIN"
            exit 1
          fi
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Publishing as GitHub App: $BOT_LOGIN (bot ID: $BOT_ID)"
          git add rodlog/releases
          if git diff --cached --quiet; then
            echo "No release files changed"
          else
            git commit -m "chore(rodlog): publish binaries from codespaces main"
            git push origin HEAD:master
          fi
